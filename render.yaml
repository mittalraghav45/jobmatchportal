services:
  - type: web
    name: jobmatchportal-personal
    runtime: node
    plan: free
    branch: fix/job-search-application-evidence
    buildCommand: npm ci --prefix backend --omit=dev && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/server.js
    healthCheckPath: /_health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: PERSONAL_USERNAME
        value: raghav
      - key: PERSONAL_PASSWORD
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: jobmatchportal
      - key: MONGODB_MAX_POOL_SIZE
        value: "5"
      - key: VITE_API_BASE_URL
        value: ""
