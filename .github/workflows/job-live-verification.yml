name: Job live verification

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  verify-live-jobs:
    if: vars.JOB_LIVE_VERIFICATION_ENABLED != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Verify stored job sources
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME || 'jobmatchportal' }}
          JOB_VERIFY_CONCURRENCY: '5'
        run: npm run jobs:verify-live
