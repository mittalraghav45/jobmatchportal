name: Job Discovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full
      batch_size:
        description: 'Companies per discovery batch'
        required: false
        default: '100'
      max_batches:
        description: 'Maximum discovery batches per run'
        required: false
        default: '20'
  schedule:
    - cron: '0 3 * * *'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Sync configured discovery companies
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/syncDiscoveryCompanies.js
      - name: Run discovery smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          npm run nightly:discovery -- --companies=vercel,monzo,wise,deliveroo,revolut | tee /tmp/discovery-summary.log
          node - /tmp/discovery-summary.log <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          const marker = '=== UNIFIED NIGHTLY DISCOVERY SUMMARY ===';
          const index = text.lastIndexOf(marker);
          if (index < 0) throw new Error('Discovery summary not found');
          const summary = JSON.parse(text.slice(index + marker.length).trim());
          const failures = [];
          if (summary.requested !== 5) failures.push(`requested=${summary.requested}`);
          if (summary.selected !== 5) failures.push(`selected=${summary.selected}`);
          if ((summary.missing || []).length) failures.push(`missing=${summary.missing.join(',')}`);
          if (summary.failed !== 0) failures.push(`failed=${summary.failed}`);
          if (summary.unconfigured !== 0) failures.push(`unconfigured=${summary.unconfigured}`);
          if (summary.invalid !== 0) failures.push(`invalid=${summary.invalid}`);
          if (summary.rejected !== 0) failures.push(`rejected=${summary.rejected}`);
          if (summary.discovered <= 0) failures.push(`discovered=${summary.discovered}`);
          if (failures.length) {
            console.error(`Discovery smoke gate failed: ${failures.join('; ')}`);
            process.exit(1);
          }
          console.log(`Discovery smoke gate passed: ${summary.discovered} jobs discovered.`);
          NODE
      - name: Run batched full discovery
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DISCOVERY_BATCH_SIZE: ${{ inputs.batch_size || '100' }}
          DISCOVERY_MAX_BATCHES: ${{ inputs.max_batches || '20' }}
        run: npm run nightly:discovery:full -- --batch-size="$DISCOVERY_BATCH_SIZE" --max-batches="$DISCOVERY_MAX_BATCHES"
