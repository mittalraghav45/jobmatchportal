name: Job Source Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Verify job sources
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run jobs:verify
