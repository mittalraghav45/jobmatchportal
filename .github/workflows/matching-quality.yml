name: Matching Quality

on:
  workflow_dispatch:
  schedule:
    # 02:15 UK during British Summer Time (01:15 UTC).
    # GitHub cron is UTC and does not follow UK daylight-saving changes.
    - cron: '15 1 * * *'

permissions:
  contents: read

jobs:
  matching-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_VERSION: '20'
      MATCH_PROFILE_ID: default
      MATCH_BATCH_SIZE: '100'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run full-corpus matcher
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -o pipefail
          npm run nightly:matching 2>&1 | tee nightly-matching.log

      - name: Publish human-readable summary
        if: always()
        working-directory: backend
        run: |
          {
            echo '# JobMatchPortal nightly quality report'
            echo
            echo "- Run: #${{ github.run_number }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Scheduled target: 02:15 UK / 01:15 UTC"
            echo
            echo '## Pipeline'
            echo '- Backend tests: see previous step; a failed test stops the matcher.'
            echo '- Full-corpus matcher: attempted against the complete jobs collection.'
            echo '- Database writes: MatchResult upserts only; no job deletion is performed by this workflow.'
            echo
            echo '## Matcher output'
            echo '```json'
            python - <<'PY'
import json
from pathlib import Path
text = Path('nightly-matching.log').read_text(errors='replace') if Path('nightly-matching.log').exists() else ''
marker = text.rfind('{')
if marker >= 0:
    candidate = text[marker:]
    try:
        obj = json.loads(candidate)
        print(json.dumps(obj, indent=2))
    except Exception:
        print(text[-12000:])
else:
    print(text[-12000:])
PY
            echo '```'
            echo
            echo '## Interpretation'
            if grep -q '"strong": 0' nightly-matching.log 2>/dev/null; then
              echo '⚠️ No Strong matches were produced. Treat this as a matcher-calibration signal, not a discovery failure.'
            else
              echo '✅ At least one Strong match was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload matcher log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-matching-${{ github.run_number }}
          path: backend/nightly-matching.log
          if-no-files-found: ignore
          retention-days: 14
