name: Apify Unresolved Company Test

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of unresolved companies to test'
        required: false
        default: '10'
  pull_request:
    paths:
      - 'backend/services/apifyJobDiscovery.js'
      - 'backend/scripts/testApifyUnresolvedCompanies.js'
      - 'backend/services/companyDiscovery.js'
      - 'backend/repositories/jobRepository.js'
      - '.github/workflows/apify-unresolved-test.yml'

permissions:
  contents: read

jobs:
  apify-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Test Apify on unresolved companies
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          APIFY_KEY: ${{ secrets.APIFY_KEY }}
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID || 'apify/playwright-scraper' }}
          APIFY_TEST_MAX_ITEMS: '10'
          APIFY_MAX_TOTAL_CHARGE_USD: '2'
        run: npm run test:apify-unresolved -- --limit="${{ inputs.limit || '10' }}"
